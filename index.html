<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Señal BTC / ETH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f4; --panel:#ffffff; --ink:#14201d; --mute:#5d6b67; --line:#d9e0dd;
  --buy:#0c8f6b; --sell:#c8412f; --wait:#b7791f; --track:#e4e9e7;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1715; --panel:#16211e; --ink:#e8f0ed; --mute:#92a39d; --line:#26352f;
    --buy:#34d3a0; --sell:#ff7a66; --wait:#e8b04a; --track:#223029; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));line-height:1.45}
main{max-width:560px;margin:0 auto}
h1{font-size:1.1rem;font-weight:600;margin:4px 0 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
button.chip{font:inherit;font-size:.9rem;padding:8px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.chip:focus-visible{outline:2px solid var(--buy);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:12px}
.price{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.chg{font-variant-numeric:tabular-nums;font-size:.95rem;margin-left:8px}
.verdict{font-size:2.6rem;font-weight:800;letter-spacing:-.03em;margin:6px 0 2px}
.verdict.buy{color:var(--buy)} .verdict.sell{color:var(--sell)} .verdict.wait{color:var(--wait)}
.sub{color:var(--mute);font-size:.92rem;margin:0 0 16px}
.gauge{position:relative;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--sell),var(--track) 50%,var(--buy));margin:8px 0 6px}
.mark{position:absolute;top:-6px;width:4px;height:22px;border-radius:2px;background:var(--ink);transform:translateX(-50%);transition:left .5s ease}
.scale{display:flex;justify-content:space-between;color:var(--mute);font-size:.8rem}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td{padding:9px 0;border-top:1px solid var(--line);vertical-align:top}
td:first-child{font-weight:600;white-space:nowrap;padding-right:10px}
td.v{font-variant-numeric:tabular-nums;color:var(--mute);text-align:right;white-space:nowrap}
.pill{display:inline-block;min-width:34px;text-align:center;border-radius:6px;font-weight:600;font-size:.82rem;padding:1px 6px;margin-right:6px}
.pill.p{background:color-mix(in srgb,var(--buy) 18%,transparent);color:var(--buy)}
.pill.n{background:color-mix(in srgb,var(--sell) 18%,transparent);color:var(--sell)}
.pill.z{background:var(--track);color:var(--mute)}
.foot{color:var(--mute);font-size:.8rem;margin-top:14px}
.err{color:var(--sell)}
@media (prefers-reduced-motion:reduce){.mark{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Señal de compra o venta</h1>
  <div class="row" id="assets" role="group" aria-label="Activo">
    <button class="chip" data-a="BTC" aria-pressed="true">Bitcoin</button>
    <button class="chip" data-a="ETH" aria-pressed="false">Ethereum</button>
  </div>
  <div class="row" id="tfs" role="group" aria-label="Temporalidad">
    <button class="chip" data-t="15m" aria-pressed="false">15 min</button>
    <button class="chip" data-t="1h" aria-pressed="true">1 hora</button>
    <button class="chip" data-t="4h" aria-pressed="false">4 horas</button>
    <button class="chip" data-t="1d" aria-pressed="false">1 día</button>
  </div>

  <section class="card" aria-live="polite">
    <div><span class="price" id="price">—</span><span class="chg" id="chg"></span></div>
    <div class="verdict wait" id="verdict">Cargando…</div>
    <p class="sub" id="sub">Consultando datos públicos de Binance.</p>
    <div class="gauge"><div class="mark" id="mark" style="left:50%"></div></div>
    <div class="scale"><span>Vender</span><span>Esperar</span><span>Comprar</span></div>
  </section>

  <section class="card">
    <table id="tbl"></table>
  </section>

  <p class="foot" id="foot"></p>
  <p class="foot">Es un análisis técnico automático con fines informativos. No es asesoramiento financiero y no garantiza resultados.</p>
</main>

<script>
(function(){
  var HOSTS = ['https://api.binance.com', 'https://data-api.binance.vision'];
  var REFRESH_MS = 15000;
  var asset = 'BTC', tf = '1h', timer = null;

  function $(id){ return document.getElementById(id); }

  async function getJSON(path){
    for (var i = 0; i < HOSTS.length; i++){
      try {
        var r = await fetch(HOSTS[i] + path);
        if (r.ok) return await r.json();
      } catch (e) {}
    }
    throw new Error('No se pudo conectar con Binance');
  }

  /* ---------- indicadores ---------- */
  function ema(arr, p){
    var k = 2 / (p + 1), out = [arr[0]];
    for (var i = 1; i < arr.length; i++) out.push(arr[i] * k + out[i - 1] * (1 - k));
    return out;
  }
  function sma(arr, p){
    var s = arr.slice(-p); return s.reduce(function(a, b){ return a + b; }, 0) / s.length;
  }
  function std(arr, p){
    var s = arr.slice(-p), m = sma(arr, p);
    return Math.sqrt(s.reduce(function(a, b){ return a + (b - m) * (b - m); }, 0) / s.length);
  }
  function rsi(c, p){
    var g = 0, l = 0, i, d;
    for (i = 1; i <= p; i++){ d = c[i] - c[i - 1]; if (d >= 0) g += d; else l -= d; }
    g /= p; l /= p;
    for (i = p + 1; i < c.length; i++){
      d = c[i] - c[i - 1];
      g = (g * (p - 1) + (d > 0 ? d : 0)) / p;
      l = (l * (p - 1) + (d < 0 ? -d : 0)) / p;
    }
    return l === 0 ? 100 : 100 - 100 / (1 + g / l);
  }

  function analyze(c){
    var last = c[c.length - 1], rows = [], score = 0;

    var r = rsi(c, 14), v;
    if (r < 30) v = 2; else if (r < 40) v = 1; else if (r > 70) v = -2; else if (r > 60) v = -1; else v = 0;
    score += v;
    rows.push(['RSI (14)', r.toFixed(1), v,
      r < 30 ? 'Sobreventa: posible rebote' : r < 40 ? 'Algo débil, cerca de sobreventa' :
      r > 70 ? 'Sobrecompra: riesgo de caída' : r > 60 ? 'Algo fuerte, cerca de sobrecompra' : 'Zona neutral']);

    var e12 = ema(c, 12), e26 = ema(c, 26);
    var macd = e12.map(function(x, i){ return x - e26[i]; });
    var sig = ema(macd, 9);
    var h = macd[macd.length - 1] - sig[sig.length - 1];
    var hp = macd[macd.length - 2] - sig[sig.length - 2];
    v = h > 0 ? (h > hp ? 1 : 0) : (h < hp ? -1 : 0);
    score += v;
    rows.push(['MACD', h.toFixed(2), v,
      h > 0 ? (h > hp ? 'Impulso alcista creciendo' : 'Alcista, pero perdiendo fuerza') :
              (h < hp ? 'Impulso bajista creciendo' : 'Bajista, pero perdiendo fuerza')]);

    var m20 = ema(c, 20), m50 = ema(c, 50);
    var a = m20[m20.length - 1], b = m50[m50.length - 1];
    v = a > b ? 1 : -1;
    if (last > a && last > b && v === 1) v = 2;
    if (last < a && last < b && v === -1) v = -2;
    score += v;
    rows.push(['Tendencia (EMA 20/50)', (a > b ? '20 > 50' : '20 < 50'), v,
      v >= 1 ? 'Tendencia alcista' : 'Tendencia bajista']);

    var mid = sma(c, 20), sd = std(c, 20), up = mid + 2 * sd, lo = mid - 2 * sd;
    v = last < lo ? 1 : last > up ? -1 : 0;
    score += v;
    rows.push(['Bandas de Bollinger', last < lo ? 'bajo la banda' : last > up ? 'sobre la banda' : 'dentro', v,
      last < lo ? 'Precio por debajo del rango normal' : last > up ? 'Precio por encima del rango normal' : 'Precio dentro del rango normal']);

    return { score: score, rows: rows };
  }

  /* ---------- interfaz ---------- */
  function fmt(n){
    return '$' + Number(n).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function render(price, chgPct, res){
    var s = res.score, max = 6;
    var cls = s >= 3 ? 'buy' : s <= -3 ? 'sell' : 'wait';
    var txt = s >= 3 ? 'Comprar' : s <= -3 ? 'Vender' : 'Esperar';
    var sub = s >= 3 ? 'La mayoría de los indicadores apuntan al alza.' :
              s <= -3 ? 'La mayoría de los indicadores apuntan a la baja.' :
              s > 0 ? 'Leve inclinación a comprar, sin confirmación clara.' :
              s < 0 ? 'Leve inclinación a vender, sin confirmación clara.' : 'Las señales se compensan entre sí.';
    $('price').textContent = fmt(price);
    var ch = $('chg');
    ch.textContent = (chgPct >= 0 ? '+' : '') + chgPct.toFixed(2) + '% en 24 h';
    ch.style.color = chgPct >= 0 ? 'var(--buy)' : 'var(--sell)';
    var vd = $('verdict'); vd.textContent = txt; vd.className = 'verdict ' + cls;
    $('sub').textContent = sub + ' Puntaje: ' + (s > 0 ? '+' : '') + s + ' de ±' + max + '.';
    $('mark').style.left = (50 + (Math.max(-max, Math.min(max, s)) / max) * 50) + '%';

    var html = '';
    res.rows.forEach(function(r){
      var p = r[2] > 0 ? 'p' : r[2] < 0 ? 'n' : 'z';
      var label = (r[2] > 0 ? '+' : '') + r[2];
      html += '<tr><td>' + r[0] + '</td><td><span class="pill ' + p + '">' + label + '</span>' + r[3] +
              '</td><td class="v">' + r[1] + '</td></tr>';
    });
    $('tbl').innerHTML = html;
    $('foot').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-AR') + ' · se refresca cada 15 s · datos: Binance';
    $('foot').classList.remove('err');
  }

  async function update(){
    var sym = asset + 'USDT';
    try {
      var out = await Promise.all([
        getJSON('/api/v3/klines?symbol=' + sym + '&interval=' + tf + '&limit=200'),
        getJSON('/api/v3/ticker/24hr?symbol=' + sym)
      ]);
      var closes = out[0].map(function(k){ return parseFloat(k[4]); });
      render(parseFloat(out[1].lastPrice), parseFloat(out[1].priceChangePercent), analyze(closes));
    } catch (e) {
      $('foot').textContent = 'No se pudieron obtener los datos. Reintentando en unos segundos.';
      $('foot').classList.add('err');
    }
  }

  function start(){
    clearInterval(timer);
    $('verdict').textContent = 'Cargando…'; $('verdict').className = 'verdict wait';
    update();
    timer = setInterval(update, REFRESH_MS);
  }

  function bind(boxId, attr, setter){
    $(boxId).addEventListener('click', function(e){
      var b = e.target.closest('button'); if (!b) return;
      Array.prototype.forEach.call($(boxId).children, function(x){ x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      setter(b.getAttribute(attr)); start();
    });
  }
  bind('assets', 'data-a', function(v){ asset = v; });
  bind('tfs', 'data-t', function(v){ tf = v; });
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) update(); });
  start();
})();
</script>
</body>
</html>
